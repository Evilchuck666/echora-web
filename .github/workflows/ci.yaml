---
name: Checks and tests

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check and build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Install Playwright's Chromium and Firefox
        run: bunx playwright install --with-deps chromium firefox

      # Firefox plays audio only through a sound server, and the runner has none (no sound card either): without it the
      # tracks of the tests never move on. PulseAudio gives it a silent output (module-always-sink's null sink).
      # Chromium doesn't need it: headless, it has a fake audio output of its own.
      - name: Start a sound server for Firefox
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info | grep -E 'Server Name|Default Sink'

      # Against the mock API, in Chromium and in Firefox (with its own autoplay rules): the live tests need a running
      # Echora API and are run by hand.
      - name: End-to-end tests
        run: bun run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
