---
name: Checks and tests

on:
  push:
    branches: [main]
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

# The JavaScript actions below run on Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Keep the workflow visible to required checks; only relevant jobs run.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.filter.outputs.checks }}
      e2e: ${{ steps.filter.outputs.e2e }}
      browser_tests: ${{ steps.filter.outputs.browser_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: filter
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_FILTERS: |
            {
              "checks": {
                "include": [
                  "src/**",
                  "public/**",
                  "index.html",
                  "package.json",
                  "bun.lock",
                  "tsconfig*.json",
                  "vite.config.*",
                  ".env",
                  ".env.production",
                  ".github/workflows/ci.yaml",
                  ".oxlintrc.json",
                  "e2e/**",
                  "playwright.config.*"
                ],
                "exclude": []
              },
              "e2e": {
                "include": [
                  "src/**",
                  "public/**",
                  "index.html",
                  "package.json",
                  "bun.lock",
                  "tsconfig*.json",
                  "vite.config.*",
                  ".env",
                  ".env.production",
                  ".github/workflows/ci.yaml",
                  "playwright.config.*"
                ],
                "exclude": [
                  "**/*.test.*",
                  "**/*.spec.*",
                  "**/__tests__/**"
                ]
              },
              "browser_tests": {
                "include": [
                  "e2e/**"
                ],
                "exclude": []
              }
            }
        run: |
          import fnmatch
          import json
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          filters = json.loads(os.environ['CHANGE_FILTERS'])
          event = json.loads(open(os.environ['GITHUB_EVENT_PATH']).read())
          event_name = os.environ['EVENT_NAME']
          force = event_name in ('workflow_dispatch', 'schedule')
          paths = []
          if not force:
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  head = event['pull_request']['head']['sha']
              else:
                  base, head = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) for sha in (base, head)):
                  raise SystemExit('Invalid Git object ID in event')
              available = base.strip('0') and subprocess.run(
                  ['git', 'cat-file', '-e', base + '^{commit}'],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not available:
                  # Initial/force pushes can omit the old commit. Validate everything safely.
                  force = True
              else:
                  if event_name == 'pull_request':
                      base = git('merge-base', base, head).decode().strip()
                  paths = git('diff', '--no-renames', '--name-only', '-z', base, head).decode().split('\0')
                  paths = [path for path in paths if path]

          def matches(path, patterns):
              # fnmatch's * includes /; a leading **/ also matches root-level files.
              return any(fnmatch.fnmatchcase(path, pattern) or (
                  pattern.startswith('**/') and fnmatch.fnmatchcase(path, pattern[3:])
              ) for pattern in patterns)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, patterns in filters.items():
                  selected = force or any(
                      matches(path, patterns['include']) and not matches(path, patterns.get('exclude', []))
                      for path in paths
                  )
                  value = str(selected).lower()
                  print(f'{name}={value}', file=output)
                  print(f'{name}: {value}')

  tests:
    needs: [changes]
    if: (needs.changes.outputs.checks == 'true' || needs.changes.outputs.browser_tests == 'true')
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check and build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Install Playwright's Chromium and Firefox
        if: (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.browser_tests == 'true')
        run: bunx playwright install --with-deps chromium firefox

      # Firefox plays audio only through a sound server, and the runner has none (no sound card either): without it the
      # tracks of the tests never move on. PulseAudio gives it a silent output (module-always-sink's null sink).
      # Chromium doesn't need it: headless, it has a fake audio output of its own.
      - name: Start a sound server for Firefox
        if: (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.browser_tests == 'true')
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info | grep -E 'Server Name|Default Sink'

      # Against the mock API, in Chromium and in Firefox (with its own autoplay rules): the live tests need a running
      # Echora API and are run by hand.
      - name: End-to-end tests
        if: (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.browser_tests == 'true')
        run: bun run test:e2e

      - name: Upload the Playwright report
        if: ((needs.changes.outputs.e2e == 'true' || needs.changes.outputs.browser_tests == 'true')) && (!cancelled())
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  result:
    name: CI result
    if: always()
    needs: [changes, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          # Only success or skipped count as passing; cancelled and abandoned (a job that never
          # got a runner) fail too.
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          if results['changes']['result'] != 'success':
              failed.append('changes')
          if failed:
              raise SystemExit('Unsuccessful jobs: ' + ', '.join(sorted(set(failed))))
          print('All relevant jobs passed; unrelated jobs were skipped.')
